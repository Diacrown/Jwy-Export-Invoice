# Netlify build + redirect config for the JWY Export Invoice app.
#
# Secrets live in Netlify site env vars, not here:
#   VITE_SUPABASE_URL         https://<project>.supabase.co
#   VITE_SUPABASE_ANON_KEY    <anon-public-key>
#
# NEVER put the service-role key here or in any client env.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — all paths serve index.html so React Router works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # Supabase + self; adjust if you add other origins.
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://*.supabase.co https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self' data:"
